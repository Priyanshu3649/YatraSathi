# Application name
spring.application.name=YatraSathi

# ----------------------------
# Database (MySQL) Configuration
# ----------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/yatrasathi?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=7894

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

# ----------------------------
# Server Configuration
# ----------------------------
# Change port to avoid conflicts (8080 ? 9090)
server.port=8080

# ----------------------------
# Swagger OpenAPI
# ----------------------------
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ----------------------------
# JWT Configuration
# ----------------------------
security.jwt.secret=dev-secret-change-me
security.jwt.expiration-minutes=60

# ----------------------------
# CORS
# ----------------------------
app.cors.allowed-origins=http://localhost:5173
